<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Mareuil · Générateur de convocations</title>
<style>
  :root { --vert: #0f6e56; --vert-clair: #e1f5ee; --rouge: #a32d2d; --rouge-clair: #fcebeb; --orange: #854f0b; --orange-clair: #faeeda; --gris: #5f5e5a; --bord: #d3d1c7; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 18px; line-height: 1.5; background: #f7f6f2; color: #222; }
  header { background: var(--vert); color: #fff; padding: 16px 20px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; font-size: 15px; opacity: .9; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  section { background: #fff; border: 1px solid var(--bord); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 19px; margin: 0 0 12px; }
  label.champ { display: block; font-weight: 600; margin: 8px 0 4px; }
  select { width: 100%; font-size: 18px; padding: 12px; border: 1px solid var(--bord); border-radius: 8px; background: #fff; }
  .ligne { border-bottom: 1px solid #eee; }
  .ligne:last-child { border-bottom: none; }
  .joueur { display: flex; align-items: center; gap: 12px; padding: 10px 4px; }
  .joueur input { width: 26px; height: 26px; accent-color: var(--vert); }
  .joueur .nom { flex: 1; font-size: 18px; }
  .joueur .pres { font-size: 15px; color: var(--gris); }
  .joueur.absent .nom { text-decoration: line-through; color: #999; }
  .badge { font-size: 13px; padding: 2px 8px; border-radius: 10px; background: var(--orange-clair); color: #633806; }
  .badge.abs { background: #eee; color: #555; }
  .badge.new { background: #eeedfe; color: #3c3489; }
  .alerte { padding: 14px; border-radius: 10px; font-weight: 600; margin-bottom: 12px; }
  .alerte.ko { background: var(--rouge-clair); color: var(--rouge); border: 1px solid var(--rouge); }
  .alerte.ok { background: var(--vert-clair); color: var(--vert); border: 1px solid var(--vert); }
  .alerte.info { background: #eeedfe; color: #3c3489; border: 1px solid #534ab7; font-weight: 400; }
  .alerte.attente { background: var(--orange-clair); color: var(--orange); border: 1px solid var(--orange); }
  .alerte .detail { display: block; font-weight: 400; margin-top: 4px; }
  /* Réponses des parents : 3 gros boutons sous chaque joueur convoqué */
  .statuts { display: flex; gap: 8px; padding: 0 4px 10px; }
  .statuts button { flex: 1; width: auto; min-height: 48px; padding: 8px 4px; font-size: 18px; background: #fff; color: #222; border: 2px solid var(--bord); }
  .statuts button[data-statut="oui"][aria-pressed="true"] { background: var(--vert); color: #fff; border-color: var(--vert); }
  .statuts button[data-statut="non"][aria-pressed="true"] { background: var(--rouge); color: #fff; border-color: var(--rouge); }
  .statuts button[data-statut="attente"][aria-pressed="true"] { background: var(--orange-clair); color: var(--orange); border-color: var(--orange); }
  button:disabled { opacity: .6; cursor: default; }
  /* Joueur décoché : ses 3 boutons restent visibles mais grisés */
  .statuts button:disabled { filter: grayscale(1); opacity: .45; }
  textarea { width: 100%; min-height: 420px; font-size: 17px; font-family: inherit; padding: 12px; border: 1px solid var(--bord); border-radius: 8px; }
  .boutons { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  button, a.btn { display: block; width: 100%; text-align: center; font-size: 19px; font-weight: 600; padding: 16px; border-radius: 10px; border: none; cursor: pointer; text-decoration: none; }
  .principal { background: #25d366; color: #073b1c; }
  .secondaire { background: #fff; color: var(--vert); border: 2px solid var(--vert) !important; }
  .aide { font-size: 15px; color: var(--gris); margin: 4px 0 0; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { border: 1px solid var(--bord); border-radius: 10px; padding: 10px 12px; }
  .kpi .val { font-size: 26px; font-weight: 700; }
  .kpi .lib { font-size: 14px; color: var(--gris); }
  .jauge { height: 14px; background: #eee; border-radius: 7px; overflow: hidden; margin: 12px 0 6px; }
  .jauge div { height: 100%; }
  .risques { margin: 10px 0 0; padding-left: 20px; font-size: 16px; }
</style>
</head>
<body>
<header>
  <h1>Convocations US Mareuil</h1>
  <p>3 étapes : je choisis le match, je vérifie la liste, j'envoie sur WhatsApp.</p>
</header>

<main>
  <section>
    <h2>Indicateur des forfaits (objectif subvention)</h2>
    <div id="indicateur"></div>
  </section>

  <section>
    <h2>1. Mon équipe et mon match</h2>
    <label class="champ" for="equipe">Équipe</label>
    <select id="equipe"></select>
    <label class="champ" for="match">Match</label>
    <select id="match"></select>
  </section>

  <section>
    <h2 id="titre-joueurs">2. Joueurs proposés</h2>
    <p class="aide" id="aide-joueurs"></p>
    <div id="info-equipe"></div>
    <div id="joueurs"></div>
  </section>

  <section>
    <h2>3. Message prêt à envoyer</h2>
    <div id="alerte"></div>
    <textarea id="message" aria-label="Message de convocation"></textarea>
    <div class="boutons">
      <a id="whatsapp" class="btn principal" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>
      <button id="copier" class="secondaire">Copier le message</button>
      <button id="relance" class="secondaire" type="button">Générer la relance</button>
    </div>
  </section>
</main>

<script>
// ------------------------------------------------------------------
// DONNÉES (à remplacer plus tard par l'export de l'appli de présences
// et le calendrier de la ligue). Aucune donnée de santé : on garde
// seulement "absent", sans le motif.
// ------------------------------------------------------------------
const NB_ENTRAINEMENTS = 8;
const MAXIMUM_CONVOQUES = 14;     // 11 titulaires + 3 remplaçants
const SEUIL_PEU_PRESENT = 0.5;    // moins de 50 % de présence -> badge "peu présent"

// Suivi des forfaits demandé par la subvention.
// 35 forfaits la saison dernière -> objectif : -50 %. Chiffres de la saison en cours = démo.
const FORFAITS = {
  saisonDerniere: 35,
  objectif: 17,
  semainesSaison: 40,
  semainesEcoulees: 12,          // de septembre à fin novembre
  cetteSaison: 9,                // forfaits déjà subis cette saison (démo)
  amende: 50
};

const EQUIPES = {
  "U13": {
    coach: "Samir", minimum: 11,
    joueurs: [
      { nom: "Adam",   presences: 8 },
      { nom: "Bilal",  presences: 6 },
      { nom: "Chris",  presences: 7 },
      { nom: "Dylan",  presences: 2, absent: true },
      { nom: "Enzo",   presences: 5 },
      { nom: "Farid",  presences: 8 },
      { nom: "Gabin",  presences: 3 },
      { nom: "Hugo",   presences: 7 },
      { nom: "Ilyes",  presences: 6 },
      { nom: "Jules",  presences: 4, absent: true },
      { nom: "Kylian", presences: 8 },
      { nom: "Liam",   presences: 5 },
      { nom: "Malik",  presences: 1 }
    ],
    matchs: [
      { id: "u13-bondy", libelle: "Samedi 10h · à Bondy", jour: "samedi", heure: "10h", lieu: "Bondy", rdv: "9h au stade" }
    ]
  },
  "U15 (démo fictive)": {
    coach: "Le coach", minimum: 11,
    joueurs: [
      { nom: "Noah", presences: 7 }, { nom: "Rayan", presences: 6 },
      { nom: "Sacha", presences: 2, absent: true }, { nom: "Tom", presences: 5 },
      { nom: "Yanis", presences: 8 }, { nom: "Wassim", presences: 4 },
      { nom: "Lucas", presences: 6 }, { nom: "Mehdi", presences: 3 },
      { nom: "Nathan", presences: 7 }, { nom: "Omar", presences: 5 }
    ],
    matchs: [
      { id: "u15-demo", libelle: "Dimanche 14h · à domicile", jour: "dimanche", heure: "14h", lieu: "Mareuil (domicile)", rdv: "13h au stade" }
    ]
  },
  // Nouvelle section féminine exigée par la subvention (démarrage en janvier)
  "U15 F · section féminine (démo fictive)": {
    coach: "La coach", minimum: 11, feminin: true, nouvelle: true,
    joueurs: [
      { nom: "Inès", presences: 4 }, { nom: "Léa", presences: 4 },
      { nom: "Sarah", presences: 3 }, { nom: "Maëlys", presences: 4 },
      { nom: "Nour", presences: 2 }, { nom: "Chloé", presences: 3 },
      { nom: "Yasmine", presences: 4 }, { nom: "Emma", presences: 1, absent: true },
      { nom: "Lina", presences: 2 }, { nom: "Jade", presences: 3 },
      { nom: "Aya", presences: 4 }, { nom: "Rose", presences: 1 }
    ],
    nbSeances: 4,                 // nouvelle équipe : seulement 4 séances découverte
    matchs: [
      { id: "u15f-plateau", libelle: "Samedi 17 janvier 14h · plateau à domicile", jour: "samedi 17 janvier", heure: "14h", lieu: "Mareuil (domicile)", rdv: "13h15 au stade" }
    ]
  }
};

// ------------------------------------------------------------------
// LOGIQUE : de simples règles, pas d'IA (gratuit, fiable, explicable)
// ------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
let selection = new Set();
let statuts = {};                 // réponses des parents : prénom -> "oui" | "non" (sinon : en attente)
let modeMessage = "convocation";  // "convocation" ou "relance"

const CLE_SUIVI = "usm-suivi-";   // + id du match
const STATUTS = [["oui", "Oui"], ["non", "Non"], ["attente", "En attente"]];

function equipeCourante() { return EQUIPES[$("equipe").value]; }
function matchCourant() { return equipeCourante().matchs.find(m => m.id === $("match").value); }
function nbSeances(equipe) { return equipe.nbSeances || NB_ENTRAINEMENTS; }
function statut(nom) { return statuts[nom] || "attente"; }
function pluriel(n, mot) { return n > 1 ? mot + "s" : mot; }

// Suivi des confirmations, mémorisé sur le téléphone (une clé par match).
// Si localStorage n'est pas disponible, la page marche quand même, sans mémoire.
function lireSuivi(idMatch) {
  try { return JSON.parse(localStorage.getItem(CLE_SUIVI + idMatch)) || {}; }
  catch { return {}; }
}
function enregistrerSuivi() {
  try { localStorage.setItem(CLE_SUIVI + matchCourant().id, JSON.stringify({ convoques: [...selection], statuts })); }
  catch { /* stockage indisponible : on continue sans mémoire */ }
}

// Au choix d'un match : reprendre la liste et les réponses déjà notées, sinon la proposition automatique
function chargerMatch() {
  const equipe = equipeCourante();
  const suivi = lireSuivi($("match").value);
  const disponibles = equipe.joueurs.filter(j => !j.absent).map(j => j.nom);
  selection = new Set(Array.isArray(suivi.convoques)
    ? suivi.convoques.filter(n => disponibles.includes(n))
    : proposerJoueurs(equipe));
  statuts = {};
  Object.entries(suivi.statuts || {}).forEach(([nom, s]) => {
    if (disponibles.includes(nom) && (s === "oui" || s === "non")) statuts[nom] = s;
  });
  modeMessage = "convocation";
  afficherJoueurs();
}

// Règle 2 : retirer les absents, trier par présence, garder les plus présents
function proposerJoueurs(equipe) {
  return equipe.joueurs
    .filter(j => !j.absent)
    .sort((a, b) => b.presences - a.presences)
    .slice(0, MAXIMUM_CONVOQUES)
    .map(j => j.nom);
}

// Indicateur forfaits : où en est le club par rapport à l'objectif de la subvention ?
function afficherIndicateur() {
  const f = FORFAITS;
  const projection = Math.round(f.cetteSaison / f.semainesEcoulees * f.semainesSaison);
  const enRetard = projection > f.objectif;
  const pct = Math.min(100, Math.round(f.cetteSaison / f.objectif * 100));
  const aRisque = Object.entries(EQUIPES)
    .filter(([, e]) => e.joueurs.filter(j => !j.absent).length < e.minimum)
    .map(([nom, e]) => `${nom} : ${e.joueurs.filter(j => !j.absent).length}/${e.minimum}`);

  $("indicateur").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="val">${f.cetteSaison} / ${f.objectif}</div><div class="lib">forfaits cette saison / objectif max</div></div>
      <div class="kpi"><div class="val">${f.cetteSaison * f.amende} €</div><div class="lib">d'amendes déjà payées</div></div>
    </div>
    <div class="jauge" aria-label="Forfaits utilisés par rapport à l'objectif"><div style="width:${pct}%;background:${enRetard ? "var(--rouge)" : "var(--vert)"}"></div></div>
    <div class="alerte ${enRetard ? "ko" : "ok"}">
      ${enRetard
        ? `Au rythme actuel : ${projection} forfaits en fin de saison. L'objectif de ${f.objectif} (−50 % par rapport à ${f.saisonDerniere}) n'est pas tenu. La subvention est en jeu.`
        : `Au rythme actuel : ${projection} forfaits en fin de saison. L'objectif de ${f.objectif} est tenu.`}
    </div>
    <strong>Équipes à risque pour le prochain match :</strong>
    ${aRisque.length ? `<ul class="risques">${aRisque.map(r => `<li>${r} joueurs disponibles</li>`).join("")}</ul>` : `<p class="aide">Aucune.</p>`}
    <p class="aide">Chiffres de la saison en cours : démonstration.</p>`;
}

function remplirEquipes() {
  $("equipe").innerHTML = Object.keys(EQUIPES).map(n => `<option>${n}</option>`).join("");
}

function remplirMatchs() {
  $("match").innerHTML = equipeCourante().matchs
    .map(m => `<option value="${m.id}">${m.libelle}</option>`).join("");
  chargerMatch();
}

function afficherJoueurs() {
  const equipe = equipeCourante();
  const n = nbSeances(equipe);
  $("titre-joueurs").textContent = equipe.feminin ? "2. Joueuses proposées" : "2. Joueurs proposés";
  $("aide-joueurs").textContent = `Classés du plus présent au moins présent aux ${n} derniers entraînements. Les absences déclarées sont retirées. Vous pouvez cocher ou décocher. Quand les parents répondent, touchez Oui ou Non.`;
  $("info-equipe").innerHTML = equipe.nouvelle
    ? `<div class="alerte info">Nouvelle équipe (section féminine, janvier) : seulement ${n} séances d'historique. La liste est indicative, et le badge « peu présent » n'est pas affiché pour ne pas décourager les nouvelles joueuses.</div>`
    : "";
  const tries = [...equipe.joueurs].sort((a, b) => (!!a.absent - !!b.absent) || (b.presences - a.presences));
  $("joueurs").innerHTML = tries.map(j => {
    const peu = !equipe.nouvelle && !j.absent && j.presences / n < SEUIL_PEU_PRESENT;
    const boutons = j.absent ? "" : `<div class="statuts" role="group" aria-label="Réponse des parents pour ${j.nom}" data-nom="${j.nom}">
      ${STATUTS.map(([val, lib]) => `<button type="button" data-statut="${val}" aria-pressed="${statut(j.nom) === val}" ${selection.has(j.nom) ? "" : "disabled"}>${lib}</button>`).join("")}
    </div>`;
    return `<div class="ligne">
      <label class="joueur ${j.absent ? "absent" : ""}">
        <input type="checkbox" data-nom="${j.nom}" ${selection.has(j.nom) ? "checked" : ""} ${j.absent ? "disabled" : ""}>
        <span class="nom">${j.nom}</span>
        ${j.absent ? '<span class="badge abs">absent' + (equipe.feminin ? "e" : "") + '</span>' : ""}
        ${peu ? '<span class="badge">peu présent</span>' : ""}
        ${equipe.nouvelle && !j.absent ? '<span class="badge new">nouvelle</span>' : ""}
        <span class="pres">${j.presences}/${n}</span>
      </label>
      ${boutons}
    </div>`;
  }).join("");
  document.querySelectorAll("#joueurs input").forEach(cb => cb.addEventListener("change", () => {
    cb.checked ? selection.add(cb.dataset.nom) : selection.delete(cb.dataset.nom);
    const groupe = cb.closest(".ligne").querySelector(".statuts");
    if (groupe) groupe.querySelectorAll("button").forEach(b => b.disabled = !cb.checked);
    enregistrerSuivi();
    genererMessage();
  }));
  document.querySelectorAll(".statuts button").forEach(b => b.addEventListener("click", () => {
    const groupe = b.parentElement;
    const nom = groupe.dataset.nom;
    if (b.dataset.statut === "attente") delete statuts[nom]; else statuts[nom] = b.dataset.statut;
    groupe.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    enregistrerSuivi();
    genererMessage();
  }));
  genererMessage();
}

// Règle 3 : message WhatsApp + alerte basée sur les réponses des parents
//   rouge  : convoqués moins les « Non » < minimum -> risque de forfait
//   orange : assez de joueurs possibles, mais pas encore assez de « Oui »
//   vert   : assez de « Oui »
function genererMessage() {
  const equipe = equipeCourante();
  const match = matchCourant();
  const convoques = equipe.joueurs.filter(j => selection.has(j.nom)).sort((a, b) => b.presences - a.presences).map(j => j.nom);
  const nb = convoques.length;
  const mot = equipe.feminin ? "joueuse" : "joueur";
  const e = equipe.feminin ? "e" : "";
  const enAttente = convoques.filter(n => statut(n) === "attente");
  const nbOui = convoques.filter(n => statut(n) === "oui").length;
  const nbNon = convoques.filter(n => statut(n) === "non").length;
  const possibles = nb - nbNon;
  const detail = `<span class="detail">${nbOui} ${pluriel(nbOui, "confirmé" + e)}, ${enAttente.length} en attente${nbNon ? `, ${nbNon} non` : ""}, minimum ${equipe.minimum}.</span>`;

  if (possibles < equipe.minimum) {
    $("alerte").innerHTML = `<div class="alerte ko">Attention : seulement ${possibles} ${mot}(s) sur ${equipe.minimum} minimum. Risque de forfait (amende ${FORFAITS.amende} €, et objectif de la subvention). Pensez à appeler des ${mot}s d'une autre équipe.${detail}</div>`;
  } else if (nbOui < equipe.minimum) {
    $("alerte").innerHTML = `<div class="alerte attente">${nb} ${mot}s convoqué${e}s. En attente des réponses.${detail}</div>`;
  } else {
    $("alerte").innerHTML = `<div class="alerte ok">${nbOui} ${mot}s confirmé${e}s : l'équipe est complète.${detail}</div>`;
  }

  if (enAttente.length === 0) modeMessage = "convocation";
  const relance = $("relance");
  relance.disabled = modeMessage === "convocation" && enAttente.length === 0;
  relance.textContent = modeMessage === "relance" ? "Revenir à la convocation"
    : enAttente.length ? `Générer la relance (${enAttente.length} en attente)`
    : "Aucune relance : personne en attente";

  const nomEquipe = $("equipe").value.replace(" (démo fictive)", "");
  // Relance courte : ne cite que les « En attente » (jamais les « Non », jamais de motif)
  const message = modeMessage === "relance"
? `Relance ${nomEquipe} : match ${match.jour} à ${match.heure} à ${match.lieu}

Pas encore de réponse pour :
${enAttente.map(n => "- " + n).join("\n")}

Merci de répondre OUI ou NON à ce message.

${equipe.coach}`
: `Convocation ${nomEquipe} : match ${match.jour} à ${match.heure} à ${match.lieu}

Rendez-vous : ${match.rdv}

${equipe.feminin ? "Joueuses convoquées" : "Joueurs convoqués"} (${nb}) :
${convoques.map(n => "- " + n).join("\n")}

Merci de confirmer la présence de votre enfant en répondant OUI ou NON à ce message.

${equipe.coach}`;

  $("message").value = message;
  majLienWhatsApp();
}

function majLienWhatsApp() {
  $("whatsapp").href = "https://wa.me/?text=" + encodeURIComponent($("message").value);
}

$("equipe").addEventListener("change", remplirMatchs);
$("match").addEventListener("change", chargerMatch);
$("relance").addEventListener("click", () => {
  modeMessage = modeMessage === "relance" ? "convocation" : "relance";
  genererMessage();
});
$("message").addEventListener("input", majLienWhatsApp);
$("copier").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("message").value); $("copier").textContent = "Message copié !"; }
  catch { $("message").select(); document.execCommand("copy"); $("copier").textContent = "Message copié !"; }
  setTimeout(() => $("copier").textContent = "Copier le message", 2000);
});

afficherIndicateur();
remplirEquipes();
remplirMatchs();
</script>
</body>
</html>
